services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trena
      POSTGRES_PASSWORD: trena
      POSTGRES_DB: trena
    ports:
      - "5433:5432"
    volumes:
      - trena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trena -d trena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trena_pgdata:
